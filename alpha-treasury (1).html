<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA TREASURY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0a0a33;
    --navy-900:#0f0f4a;
    --navy-800:#151566;
    --navy-700:#1c1c86;
    --royal:#2b2bd6;
    --gold:#f0b429;
    --gold-light:#ffd868;
    --gold-dim:#c98f16;
    --cream:#f7f4ec;
    --paper:#fffdf8;
    --ink:#14141f;
    --ink-soft:#4a4a5e;
    --line:#e4dfd0;
    --pending:#d98c1f;
    --pending-bg:#fdf1de;
    --resolved:#237a4f;
    --resolved-bg:#e4f5ec;
    --danger:#c23b3b;
    --danger-bg:#fbe8e6;
    --radius:14px;
    --shadow:0 8px 28px rgba(10,10,51,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  ::selection{background:var(--gold-light);color:var(--navy-950);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Cinzel',serif;}

  #app{display:flex;min-height:100vh;flex-direction:column;}
  .topbar{
    background:linear-gradient(120deg,var(--navy-950),var(--navy-800) 70%);color:var(--cream);
    display:flex;align-items:center;justify-content:space-between;padding:12px 18px;
    position:sticky;top:0;z-index:40;box-shadow:0 4px 20px rgba(10,10,51,0.25);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-chip{display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--gold);}
  .logo-chip svg{width:100%;height:100%;filter:drop-shadow(0 2px 6px rgba(10,10,51,0.35));}
  .brand .logo-chip{width:38px;height:38px;}
  .brand .name{display:flex;flex-direction:column;line-height:1.1;}
  .brand .name b{font-family:'Cinzel',serif;font-weight:700;letter-spacing:1.2px;font-size:15px;color:var(--gold-light);}
  .brand .name span{font-size:9.5px;letter-spacing:2px;color:#c9c9ea;text-transform:uppercase;}
  .who{display:flex;align-items:center;gap:8px;}
  .who .chip{background:rgba(240,180,41,0.14);border:1px solid rgba(240,180,41,0.45);color:var(--gold-light);
    font-size:11px;font-weight:700;letter-spacing:0.5px;padding:5px 10px;border-radius:20px;text-transform:uppercase;}
  .who button{background:none;border:1px solid rgba(255,255,255,0.25);color:#d8d8ee;font-size:11px;padding:5px 10px;border-radius:20px;cursor:pointer;font-family:'Manrope',sans-serif;}
  .who button:hover{border-color:var(--gold);color:var(--gold-light);}
  .who button svg{width:13px;height:13px;display:block;}

  main{flex:1;padding:18px 16px 90px;max-width:920px;margin:0 auto;width:100%;}

  .navbar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--navy-950);display:flex;justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,0.25);}
  .navbar button{background:none;border:none;color:#9797c4;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:'Manrope',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0.4px;padding:6px 8px;border-radius:10px;flex:1;text-transform:uppercase;}
  .navbar button svg{width:19px;height:19px;}
  .navbar button.active{color:var(--gold-light);position:relative;}
  .navbar button.active::after{content:'';position:absolute;background:var(--gold);border-radius:3px;bottom:2px;left:50%;width:18px;height:3px;transform:translateX(-50%);}
  .navbar-logo{display:none;}
  @media(min-width:820px){
    #app{flex-direction:row;}
    .navbar{position:sticky;top:0;left:0;bottom:auto;flex-direction:column;width:180px;height:100vh;justify-content:flex-start;padding:18px 10px;gap:4px;box-shadow:4px 0 20px rgba(0,0,0,0.2);}
    .navbar-logo{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;}
    .navbar-logo .logo-chip{width:32px;height:32px;}
    .navbar-logo b{font-family:'Cinzel',serif;font-size:12px;color:var(--gold-light);letter-spacing:1px;line-height:1.2;}
    .navbar button{flex-direction:row;justify-content:flex-start;font-size:12px;padding:11px 12px;gap:10px;}
    .topbar{display:none;}
    .top-desktop{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 22px;border-bottom:1px solid var(--line);margin-bottom:18px;}
    main{max-width:760px;padding-top:22px;}
  }
  .top-desktop{display:none;}

  .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,var(--navy-800),var(--navy-950) 70%);padding:24px;}
  .gate-card{background:var(--paper);border-radius:20px;padding:34px 28px;max-width:380px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,0.4);text-align:center;animation:cardRise .5s cubic-bezier(.2,.9,.3,1);}
  @keyframes cardRise{from{opacity:0;transform:translateY(28px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .view-enter{animation:viewIn .4s cubic-bezier(.2,.9,.3,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .gate-card .logo-chip{width:84px;height:84px;margin:0 auto 10px;color:var(--gold);animation:crestFloat 3.2s ease-in-out infinite;}
  .gate-card h1{font-family:'Cinzel',serif;font-size:23px;letter-spacing:2px;margin:6px 0 2px;color:var(--navy-950);}
  .gate-card .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dim);font-weight:700;margin-bottom:22px;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);font-family:'Manrope',sans-serif;font-size:14px;background:var(--cream);color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--royal);outline-offset:1px;border-color:var(--royal);}
  .type-pick{display:flex;gap:10px;margin-bottom:18px;}
  .type-pick button{flex:1;padding:14px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:6px;}
  .type-pick button svg{width:20px;height:20px;}
  .type-pick button.sel{border-color:var(--royal);background:#eceafc;color:var(--navy-950);}
  .btn-primary{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;background:linear-gradient(120deg,var(--navy-900),var(--royal));color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.4px;box-shadow:0 8px 20px rgba(43,43,214,0.35);display:flex;align-items:center;justify-content:center;gap:7px;}
  .btn-primary svg{width:15px;height:15px;flex-shrink:0;}
  .btn-primary:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;}
  .gate-note{font-size:11px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

  h2.section-title{font-family:'Cinzel',serif;font-size:19px;color:var(--navy-950);letter-spacing:0.5px;display:flex;align-items:center;gap:9px;margin:0 0 4px;position:relative;padding-bottom:9px;}
  h2.section-title::after{content:'';position:absolute;left:0;bottom:0;width:38px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));}
  h2.section-title svg{width:20px;height:20px;color:var(--gold-dim);}
  .subtext{color:var(--ink-soft);font-size:12.5px;margin:10px 0 18px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  @media(min-width:560px){.grid-stats{grid-template-columns:repeat(4,1fr);}}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;position:relative;overflow:hidden;transition:box-shadow .2s ease, transform .2s ease;}
  .stat:hover{box-shadow:0 10px 22px rgba(10,10,51,0.1);transform:translateY(-2px);}
  .stat-icon{position:absolute;top:10px;right:10px;width:26px;height:26px;color:var(--line);opacity:.9;}
  .stat-icon svg{width:100%;height:100%;}
  .stat.gold .stat-icon{color:var(--gold);}
  .stat.pend .stat-icon{color:var(--pending);}
  .stat.res .stat-icon{color:var(--resolved);}
  .stat.danger .stat-icon{color:var(--danger);}
  .stat b{font-family:'JetBrains Mono',monospace;font-size:24px;display:block;color:var(--navy-950);}
  .stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;font-weight:700;color:var(--ink-soft);}
  .stat.gold{border-color:var(--gold);}
  .stat.gold b{color:var(--gold-dim);}
  .stat.pend b{color:var(--pending);}
  .stat.res b{color:var(--resolved);}
  .stat.danger b{color:var(--danger);}

  .list-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);transition:background .15s ease;border-radius:10px;}
  .list-item:hover{background:rgba(43,43,214,0.045);}
  .list-item:last-child{border-bottom:none;}
  .tx-icon{width:38px;height:38px;border-radius:10px;background:var(--navy-900);color:var(--gold-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tx-icon svg{width:18px;height:18px;}
  .tx-icon.expense{background:var(--danger-bg);color:var(--danger);}
  .tx-icon.collection{background:var(--resolved-bg);color:var(--resolved);}
  .li-main{flex:1;min-width:0;}
  .li-main b{font-size:13.5px;display:block;color:var(--ink);}
  .li-main span{font-size:11.5px;color:var(--ink-soft);}
  .amt{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14px;flex-shrink:0;text-align:right;}
  .amt.pos{color:var(--resolved);}
  .amt.neg{color:var(--danger);}
  .status-chip{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;padding:4px 9px;border-radius:20px;flex-shrink:0;display:inline-flex;align-items:center;gap:4px;}
  .status-chip svg{width:11px;height:11px;}
  .status-chip.pending{background:var(--pending-bg);color:var(--pending);}
  .status-chip.resolved{background:var(--resolved-bg);color:var(--resolved);}
  .status-chip.forwarded{background:#fbe8e6;color:var(--danger);}
  .queue-card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff;}
  .queue-card .queue-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .queue-card .queue-actions{display:flex;gap:8px;}
  .queue-card .queue-actions .btn-sm{flex:1;justify-content:center;}

  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty-icon-wrap{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(240,180,41,0.14),rgba(240,180,41,0) 70%);}
  .empty svg{width:38px;height:38px;color:var(--gold-dim);opacity:.55;}
  .empty b{display:block;font-size:14px;color:var(--ink);margin-bottom:3px;}
  .empty span{font-size:12px;}

  .fab-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .btn-sm{padding:9px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:12.5px;font-family:'Manrope',sans-serif;background:var(--navy-950);color:#fff;display:flex;align-items:center;gap:6px;transition:transform .15s ease, filter .15s ease;}
  .btn-sm:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-sm svg{width:14px;height:14px;}
  .btn-sm.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);}
  .btn-sm.danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm.gold{background:var(--gold);color:var(--navy-950);}

  .search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:14px;}
  .search svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}
  .search input{border:none;background:none;outline:none;font-family:'Manrope',sans-serif;font-size:13.5px;width:100%;color:var(--ink);}
  .search select{border:none;background:none;font-family:'Manrope',sans-serif;font-size:12px;color:var(--ink-soft);font-weight:700;}

  form .field textarea{resize:vertical;min-height:60px;}
  .modal-back{position:fixed;inset:0;background:rgba(10,10,51,0.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:640px){.modal-back{align-items:center;}}
  .modal{background:var(--paper);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:22px 20px 26px;max-height:88vh;overflow-y:auto;animation:modalUp .25s cubic-bezier(.2,.9,.3,1);}
  @keyframes modalUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  @media(min-width:640px){.modal{border-radius:20px;}}
  .modal h2{margin-top:0;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn-primary{flex:1;}
  .close-x{float:right;background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:18px;padding:2px;}
  .close-x svg{width:16px;height:16px;display:block;}

  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--navy-950);color:var(--gold-light);padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.3);animation:toastIn .3s cubic-bezier(.3,1.4,.5,1);display:flex;align-items:center;gap:8px;}
  .toast-icon{width:15px;height:15px;flex-shrink:0;color:var(--gold);}
  .toast-icon svg{width:100%;height:100%;}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.9);}to{opacity:1;transform:translate(-50%,0) scale(1);}}
  @media(min-width:820px){.toast{bottom:22px;left:calc(50% + 90px);}}

  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:var(--gold-light);font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;gap:14px;background:radial-gradient(circle at 50% 30%,var(--navy-800),var(--navy-950) 75%);}
  .loading-crest{width:48px;height:48px;color:var(--gold);animation:crestFloat 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(240,180,41,0.45));}
  .loading-crest svg{width:100%;height:100%;}
  .loading-ring{width:26px;height:26px;border-radius:50%;border:2.5px solid rgba(240,180,41,0.2);border-top-color:var(--gold);animation:spin .9s linear infinite;}
  @keyframes crestFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  .balance-hero{background:linear-gradient(135deg,var(--navy-950),var(--navy-800) 75%);border-radius:20px;padding:22px 20px;margin-bottom:16px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .balance-hero::before{content:'';position:absolute;top:-40%;right:-10%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,180,41,0.18),transparent 70%);}
  .balance-hero .bh-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold-light);font-weight:700;opacity:.9;}
  .balance-hero .bh-amount{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:800;margin:6px 0 12px;position:relative;}
  .balance-hero .bh-row{display:flex;gap:18px;font-size:11.5px;color:#d8d8ee;position:relative;}
  .balance-hero .bh-row b{color:#fff;display:block;font-family:'JetBrains Mono',monospace;font-size:15px;}
  .icon-box svg{width:100%;height:100%;display:block;}

  form .field textarea{resize:vertical;min-height:60px;}

  .modal-back{transition:none;}

  /* ---------- Avatars (student roster, shared with Alpha Watch) ---------- */
  .avatar{width:38px;height:38px;border-radius:10px;background:var(--navy-900);color:var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:14px;flex-shrink:0;box-shadow:0 2px 6px rgba(10,10,51,0.25);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ---------- Searchable combo (student picker) ---------- */
  .combo{position:relative;}
  .combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;box-shadow:0 14px 30px rgba(10,10,51,0.22);max-height:230px;overflow-y:auto;padding:6px;}
  .combo-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;}
  .combo-item:hover, .combo-item.hl{background:rgba(43,43,214,0.08);}
  .combo-item b{font-size:13px;display:block;color:var(--ink);}
  .combo-item span{font-size:11px;color:var(--ink-soft);}
  .combo-empty{padding:14px 8px;text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .combo-item .avatar{width:26px;height:26px;font-size:11px;flex-shrink:0;}

  /* ---------- Public student dashboard ---------- */
  .public-wrap{min-height:100vh;padding:36px 20px 48px;background:radial-gradient(circle at 30% 0%,var(--navy-800),var(--navy-950) 70%);overflow-x:hidden;}
  .public-header{text-align:center;margin-bottom:20px;}
  .public-header .logo-chip{width:64px;height:64px;margin:0 auto 8px;color:var(--gold);}
  .public-header h1{font-family:'Cinzel',serif;font-size:22px;letter-spacing:2px;color:#fff;margin:0;}
  .public-header .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:4px;}
  .public-header .subtext{color:rgba(255,255,255,0.75);}
  .public-row{border-bottom:1px solid var(--line);}
  .public-row:last-child{border-bottom:none;}
  .public-row summary{list-style:none;cursor:pointer;}
  .public-row summary::-webkit-details-marker{display:none;}
  .public-row summary .list-item{border-bottom:none;margin-bottom:0;}
  .public-row[open] summary .list-item{background:var(--cream);}
  .public-detail{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:6px;}
  .public-detail-row{background:var(--cream);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-soft);}
  .public-detail-row .pd-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .public-detail-row .pd-check{font-weight:700;color:var(--ink);}
  .public-detail-row .pd-date{white-space:nowrap;color:var(--ink-soft);}
  .public-detail-row .pd-sanction{display:block;margin-top:3px;font-style:italic;}
  .status-chip.partial{background:#fdf1de;color:var(--gold-dim);}

  /* ---------- Receipt / proof-of-purchase attachment ---------- */
  .receipt-picker{display:flex;align-items:center;gap:14px;margin-bottom:2px;}
  .receipt-preview{width:64px;height:64px;border-radius:10px;background:var(--cream);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--ink-soft);}
  .receipt-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .receipt-preview svg{width:22px;height:22px;}
  .receipt-actions{display:flex;flex-direction:column;gap:6px;flex:1;}
  .receipt-actions .btn-sm{justify-content:center;}
  .receipt-hint{font-size:10.5px;color:var(--ink-soft);margin:4px 0 0;}
  .receipt-thumb-link{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--royal);cursor:pointer;text-decoration:none;}
  .receipt-thumb-link svg{width:13px;height:13px;}

  /* ---------- Liquidation report ---------- */
  .liq-narrative-input{min-height:70px;resize:vertical;}
  .liq-narrative-text{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 10px;white-space:pre-wrap;}
  .liq-entries{display:flex;flex-direction:column;gap:6px;}

  /* ---------- Public tab switcher ---------- */
  .public-tabs{display:flex;gap:8px;max-width:680px;margin:0 auto 16px;flex-wrap:wrap;}

/* ============== Storage helpers (Supabase-backed, shared with Alpha Watch) ==============
   This now connects to the SAME Supabase project/table Alpha Watch uses
   (`shared_data`, key text primary key + value jsonb), so:
   - Treasury's own data lives under its own keys (treasury_accounts,
     treasury_transactions, treasury_dues_amount) — separate from Alpha
     Watch's `accounts`/`ledger`/`standard` keys in the same table.
   - The student `roster` key is READ from that same table so Treasury can
     tie collections to real students, but Treasury never writes to it —
     the roster stays owned by Alpha Watch (Mayor manages it there). */
const SUPABASE_URL = 'https://gxwgkbplscsduscoeoph.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m3l1Dxhwj6bIse-3UwBB4w_fqZXLuD0';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// True when this page is loaded inside an <iframe> (e.g. embedded in Alpha
// Watch's "Treasury" tab) — used to hide redundant "Open Alpha Watch" links
// that would otherwise open a second, nested copy of Watch.
const IS_EMBEDDED = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();

async function loadShared(key, fallback){
  try{
    const { data, error } = await sb.from('shared_data').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : fallback;
  }catch(e){ console.error('load failed', key, e); return fallback; }
}
async function saveShared(key, value){
  try{
    const { error } = await sb.from('shared_data').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) throw error;
  }catch(e){ console.error('save failed', key, e); showToastSafe('Sync failed — check your connection and try again'); }
}
// Maps a shared_data storage key to the state property it hydrates, since
// Treasury's storage keys (treasury_accounts, treasury_transactions) are
// prefixed to avoid colliding with Alpha Watch's keys in the same table,
// but the rest of this app just reads state.accounts / state.transactions.
const STATE_KEY_FOR = { treasury_accounts:'accounts', treasury_transactions:'transactions', roster:'roster', treasury_dues_amount:'duesAmount', treasury_liquidation_notes:'liquidationNotes' };
async function mutateShared(key, mutator){
  const stateKey = STATE_KEY_FOR[key] || key;
  const latest = await loadShared(key, state[stateKey]) || [];
  const next = await mutator(latest);
  state[stateKey] = next;
  await saveShared(key, next);
  return next;
}
function showToastSafe(msg){ if(state.screen && state.screen!=='loading') showToast(msg); else console.warn(msg); }

// "Personal" data (just the local sign-in session) stays on-device via
// localStorage — it should NOT sync across browsers.
async function loadPersonal(key, fallback){
  try{
    const raw = localStorage.getItem('alpha-treasury::'+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function savePersonal(key, value){
  try{ localStorage.setItem('alpha-treasury::'+key, JSON.stringify(value)); }catch(e){ console.error('save failed', key, e); }
}

/* ============== Live sync (realtime + polling fallback) ==============
   Mirrors Alpha Watch's sync layer, watching Treasury's own keys plus the
   shared `roster` key (read-only here) so a student the Mayor adds/edits
   in Alpha Watch shows up in Treasury without a page refresh. */
const SYNC_KEYS = ['treasury_accounts','treasury_transactions','treasury_dues_amount','roster','treasury_liquidation_notes'];
let lastSyncedRaw = {};

function applyRemoteUpdate(key, value){
  if(!SYNC_KEYS.includes(key)) return;
  lastSyncedRaw[key] = JSON.stringify(value);
  const stateKey = STATE_KEY_FOR[key] || key;
  state[stateKey] = value;
  if(key==='treasury_accounts' && state.session){
    const acc = (value||[]).find(a=>a.id===state.session.accountId);
    if(!acc){
      state.session = null;
      state.screen = 'gate';
      savePersonal('session', null);
      showToastSafe('Your account was removed — please sign in again');
      return renderPreserveFocus();
    }
    if(acc.role!==state.session.role || acc.name!==state.session.name){
      state.session = {...state.session, role:acc.role, name:acc.name};
    }
  }
  if(state.modal) return;
  if(state.screen!=='app' && state.screen!=='public') return;
  renderPreserveFocus();
}
function renderPreserveFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  const hasSelection = active && 'selectionStart' in active;
  const selStart = hasSelection ? active.selectionStart : null;
  const selEnd = hasSelection ? active.selectionEnd : null;
  render();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}
function subscribeRealtime(){
  try{
    sb.channel('treasury_shared_data_sync')
      .on('postgres_changes', {event:'*', schema:'public', table:'shared_data'}, (payload)=>{
        const row = payload.new && payload.new.key ? payload.new : payload.old;
        if(!row || !row.key || !payload.new) return;
        applyRemoteUpdate(row.key, payload.new.value);
      })
      .subscribe();
  }catch(e){ console.error('realtime subscribe failed', e); }
}
function startSyncPolling(){
  setInterval(async ()=>{
    if(state.modal) return;
    if(state.screen!=='app' && state.screen!=='public') return;
    for(const key of SYNC_KEYS){
      try{
        const value = await loadShared(key, undefined);
        if(value===undefined) continue;
        const raw = JSON.stringify(value);
        if(raw!==lastSyncedRaw[key]) applyRemoteUpdate(key, value);
      }catch(e){ console.error('poll failed', key, e); }
    }
  }, 20000);
}

async function hashPassword(username, password){
  const enc = new TextEncoder();
  const data = enc.encode('alpha-treasury::'+String(username).trim().toLowerCase()+'::'+password);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowTimeHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function formatDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function formatTime(t){
  if(!t) return '';
  const [hStr,mStr] = t.split(':');
  const h = parseInt(hStr,10), m = parseInt(mStr,10);
  if(isNaN(h)||isNaN(m)) return '';
  const period = h>=12 ? 'PM' : 'AM';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}
function formatDateTime(iso,t){ const time=formatTime(t); return time?`${formatDate(iso)} · ${time}`:formatDate(iso); }
function formatPeso(n){ const v = Math.round((n||0)*100)/100; return '₱'+v.toLocaleString('en-PH',{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2}); }
function initials(name){ return (name||'').split(' ').filter(Boolean).slice(0,2).map(n=>n[0].toUpperCase()).join(''); }

}
/* Resizes/compresses an uploaded image client-side before it's stored as a
   base64 data URL — keeps receipt photos from bloating the shared_data row.
   maxSize is the longest side in pixels. */
function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('Not an image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not load image'));
      img.onload = ()=>{
        let {width, height} = img;
        const scale = Math.min(1, maxSize/Math.max(width, height));
        width = Math.max(1, Math.round(width*scale));
        height = Math.max(1, Math.round(height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; renderToastOnly(); }, 2400); }

/* ============== Derived totals ============== */
function approvedOf(type){ return state.transactions.filter(t=>t.status==='approved' && t.type===type); }
function totalCollections(){ return approvedOf('collection').reduce((s,t)=>s+t.amount,0); }
function totalExpenses(){ return approvedOf('expense').reduce((s,t)=>s+t.amount,0); }
function currentBalance(){ return totalCollections()-totalExpenses(); }
function pendingCount(){ return state.transactions.filter(t=>t.status==='pending').length; }
function unverifiedApprovedCount(){ return state.transactions.filter(t=>t.status==='approved' && !t.verified).length; }

/* ---- Per-student dues (Class Dues category only, approved entries only) ---- */
function getStudentDuesPaid(studentId){
  return state.transactions
    .filter(t=>t.status==='approved' && t.type==='collection' && t.category==='Class Dues' && t.studentId===studentId)
    .reduce((s,t)=>s+t.amount,0);
}
function getStudentOtherContributions(studentId){
  return state.transactions
    .filter(t=>t.status==='approved' && t.type==='collection' && t.category!=='Class Dues' && t.studentId===studentId)
    .reduce((s,t)=>s+t.amount,0);
}
function getStudentDuesStatus(studentId){
  const paid = getStudentDuesPaid(studentId);
  if(paid<=0) return 'unpaid';
  if(paid>=state.duesAmount) return 'paid';
  return 'partial';
}

/* ---- Liquidation report: group approved expenses by purpose/event ---- */
const GENERAL_PURPOSE_LABEL = 'General / Unspecified Expenses';
function purposeLabelOf(t){ const p = (t.purpose||'').trim(); return p || GENERAL_PURPOSE_LABEL; }
function getExpenseGroups(){
  const map = new Map();
  approvedOf('expense').forEach(t=>{
    const label = purposeLabelOf(t);
    const key = label.toLowerCase();
    if(!map.has(key)) map.set(key, {key, label, entries:[], total:0});
    const g = map.get(key);
    g.entries.push(t);
    g.total += t.amount;
  });
  return Array.from(map.values())
    .map(g=>({...g, entries: g.entries.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))}))
    .sort((a,b)=> (a.label===GENERAL_PURPOSE_LABEL) - (b.label===GENERAL_PURPOSE_LABEL) || b.total-a.total);
}

      return;
    }
    const username = uInput.value.trim();
    const password = pInput.value;
    if(!username || !password){ state._loginError='Enter your username and password.'; render(); return; }
    const passwordHash = await hashPassword(username, password);
    const account = state.accounts.find(a=> a.username.toLowerCase()===username.toLowerCase() && a.passwordHash===passwordHash);
    if(!account){
      loginLockout.attempts++;
      if(loginLockout.attempts>=5){
        loginLockout.until = Date.now()+15000;
        loginLockout.attempts = 0;
        state._loginError = 'Too many attempts — try again in 15s.';
      } else {
        state._loginError='Incorrect username or password.';
      }
      render();
      return;
    }
    loginLockout = {attempts:0, until:0};
    state.session = {name:account.name, role:account.role, username:account.username, accountId:account.id};
    await savePersonal('session', state.session);
    state._loginError=null;
    state.screen='app';
    render();
  };
  document.getElementById('loginBtn').onclick = submit;
  pInput.onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
}

function attachApprovalQueueEvents(){
  document.querySelectorAll('[data-approve-tx]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.approveTx;
      let found = true;
      await mutateShared('treasury_transactions', latest=>{
        const rec = latest.find(t=>t.id===id);
        if(!rec){ found=false; return latest; }
        rec.status='approved'; rec.approvedBy=state.session.name;
        return latest;
      });
      showToast(found ? 'Transaction approved' : 'That record was already handled elsewhere');
      render();
    };
  });
  document.querySelectorAll('[data-reject-tx]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Reject this transaction? It will not count toward the fund balance.')) return;
      let found = true;
      await mutateShared('treasury_transactions', latest=>{
        const rec = latest.find(t=>t.id===id_(b));
        if(!rec){ found=false; return latest; }
        rec.status='rejected'; rec.approvedBy=state.session.name;
        return latest;
      });
      showToast(found ? 'Transaction rejected' : 'That record was already handled elsewhere');
      render();
    };
  });
  function id_(b){ return b.dataset.rejectTx; }
  document.querySelectorAll('[data-verify-tx]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.verifyTx;
      let found = true;
      await mutateShared('treasury_transactions', latest=>{
        const rec = latest.find(t=>t.id===id);
        if(!rec){ found=false; return latest; }
        rec.verified = !rec.verified;
        rec.verifiedBy = rec.verified ? state.session.name : null;
        return latest;
      });
      showToast(found ? 'Verification updated' : 'That record was removed elsewhere');
      render();
    };
  });
}

      <div class="field"><label>Time</label><input type="time" id="lf_time" value="${nowTimeHHMM()}" required/></div>

function populateLogCategories(type){
  const sel = document.getElementById('lf_category');
  if(!sel) return;
  const cats = type==='expense' ? EXPENSE_CATEGORIES : COLLECTION_CATEGORIES;
  sel.innerHTML = cats.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  const studentField = document.getElementById('lf_student_field');
  const payeeField = document.getElementById('lf_payee_field');
  const purposeField = document.getElementById('lf_purpose_field');
  const receiptField = document.getElementById('lf_receipt_field');
  if(studentField) studentField.style.display = type==='expense' ? 'none' : '';
  if(payeeField) payeeField.style.display = type==='expense' ? '' : 'none';
  if(purposeField) purposeField.style.display = type==='expense' ? '' : 'none';
  if(receiptField) receiptField.style.display = type==='expense' ? '' : 'none';
}
function renderLogStudentCombo(filterText){
  const list = document.getElementById('lf_student_list');
  if(!list) return;
  const q = (filterText||'').trim().toLowerCase();
  const matches = state.roster.filter(s=> !q || s.name.toLowerCase().includes(q) || (s.section||'').toLowerCase().includes(q));
  if(matches.length===0){
    list.innerHTML = `<div class="combo-empty">No students found</div>`;
  } else {
    list.innerHTML = matches.slice(0,50).map(s=>`
      <div class="combo-item" data-id="${s.id}">
        ${avatarHTML(s, 'width:26px;height:26px;font-size:11px;')}
        <div><b>${escapeHtml(s.name)}</b>${s.section?`<span>${escapeHtml(s.section)}</span>`:''}</div>
      </div>`).join('');
  }
  list.style.display = 'block';
  list.querySelectorAll('.combo-item').forEach(item=>{
    item.onclick = ()=>{
      const s = state.roster.find(x=>x.id===item.dataset.id);
      if(!s) return;
      document.getElementById('lf_student_search').value = s.name;
      document.getElementById('lf_student_id').value = s.id;
      list.style.display = 'none';
    };
  });
}
function attachLogEvents(){
  const form = document.getElementById('logForm');
  if(!form) return;
  populateLogCategories('collection');
  const typeInput = document.getElementById('lf_type');
  const collBtn = document.getElementById('lf_type_collection');
  const expBtn = document.getElementById('lf_type_expense');
  collBtn.onclick = ()=>{ typeInput.value='collection'; collBtn.classList.add('sel'); expBtn.classList.remove('sel'); populateLogCategories('collection'); };
  expBtn.onclick = ()=>{ typeInput.value='expense'; expBtn.classList.add('sel'); collBtn.classList.remove('sel'); populateLogCategories('expense'); };

  const studentSearch = document.getElementById('lf_student_search');
  const studentIdInput = document.getElementById('lf_student_id');
  if(studentSearch){
    studentSearch.onfocus = ()=> renderLogStudentCombo(studentSearch.value);
    studentSearch.oninput = ()=>{ studentIdInput.value=''; renderLogStudentCombo(studentSearch.value); };
  }

  let receiptData = null;
  const receiptInput = document.getElementById('lf_receipt_input');
  const receiptBtn = document.getElementById('lf_receipt_btn');
  const receiptRemove = document.getElementById('lf_receipt_remove');
  const receiptPreview = document.getElementById('lf_receipt_preview');
  if(receiptBtn) receiptBtn.onclick = ()=> receiptInput.click();
  if(receiptInput) receiptInput.onchange = async ()=>{
    const file = receiptInput.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file, 1000);
      receiptData = dataUrl;
      receiptPreview.innerHTML = `<img src="${dataUrl}" alt=""/>`;
      receiptRemove.style.display = '';
    }catch(err){ showToast('Could not read that image'); }
    receiptInput.value = '';
  };
  if(receiptRemove) receiptRemove.onclick = ()=>{
    receiptData = null;
    receiptPreview.innerHTML = ICON.image;
    receiptRemove.style.display = 'none';
  };

  form.onsubmit = async (e)=>{
    e.preventDefault();
    const amount = parseFloat(document.getElementById('lf_amount').value);
    if(!amount || amount<=0){ showToast('Enter a valid amount'); return; }
    const type = typeInput.value;
    let studentId = '';
    let payer = '';
    if(type==='collection'){
      studentId = studentIdInput.value;
      const typed = studentSearch.value.trim();
      if(!studentId && typed){
        const exact = state.roster.find(s=>s.name.trim().toLowerCase()===typed.toLowerCase());
        if(exact) studentId = exact.id;
      }
      const matchedStudent = studentId ? state.roster.find(s=>s.id===studentId) : null;
      payer = matchedStudent ? matchedStudent.name : typed;
    } else {
      payer = document.getElementById('lf_payee').value.trim();
    }
    const rec = {
      id: 'tx_'+Date.now(),
      type,
      category: document.getElementById('lf_category').value,
      amount,
      studentId: studentId || null,
      payer,
      purpose: type==='expense' ? document.getElementById('lf_purpose').value.trim() : '',
      date: document.getElementById('lf_date').value,
      time: document.getElementById('lf_time').value || nowTimeHHMM(),
      note: document.getElementById('lf_note').value.trim(),
      receipt: type==='expense' ? receiptData : null,
      recordedBy: document.getElementById('lf_reporter').value.trim() || state.session.name,
      status: state.session.role==='mayor' ? 'approved' : 'pending',
      approvedBy: state.session.role==='mayor' ? state.session.name : null,
      verified: false,
      verifiedBy: null,
    };
    await mutateShared('treasury_transactions', latest=>{ latest.push(rec); return latest; });
    showToast(rec.status==='approved' ? 'Entry logged and approved' : 'Entry submitted for approval');
    state.tab='ledger';
    render();
  };
}

/* ============== LEDGER ============== */
function ledgerHTML(){
  const role = state.session.role;
  const q = state.search.toLowerCase();
  let rows = state.transactions.slice();
  if(state.typeFilter!=='all') rows = rows.filter(t=>t.type===state.typeFilter);
  if(state.statusFilter!=='all') rows = rows.filter(t=>t.status===state.statusFilter);
  if(q) rows = rows.filter(t=> t.category.toLowerCase().includes(q) || (t.note||'').toLowerCase().includes(q) || (t.payer||'').toLowerCase().includes(q) || (t.recordedBy||'').toLowerCase().includes(q));
  rows.sort((a,b)=> (b.date+b.time).localeCompare(a.date+a.time));

  return `
    <h2 class="section-title">${ICON.list}Transaction Ledger</h2>
    <p class="subtext">Every collection and expense, in one place.</p>
    <div class="fab-row">
      <div class="search" style="flex:1;margin-bottom:0;">${ICON.search}<input id="ledgerSearch" placeholder="Search category, note, name…" value="${escapeHtml(state.search)}"/></div>
      <select id="ledgerTypeFilter" class="btn-sm ghost" style="cursor:pointer;">
        <option value="all" ${state.typeFilter==='all'?'selected':''}>All Types</option>
        <option value="collection" ${state.typeFilter==='collection'?'selected':''}>Collections</option>
        <option value="expense" ${state.typeFilter==='expense'?'selected':''}>Expenses</option>
      </select>
      <select id="ledgerStatusFilter" class="btn-sm ghost" style="cursor:pointer;">
        <option value="all" ${state.statusFilter==='all'?'selected':''}>All Statuses</option>
        <option value="pending" ${state.statusFilter==='pending'?'selected':''}>Pending</option>
        <option value="approved" ${state.statusFilter==='approved'?'selected':''}>Approved</option>
        <option value="rejected" ${state.statusFilter==='rejected'?'selected':''}>Rejected</option>
      </select>
    </div>
    <div class="card">
      ${rows.length===0? emptyState('No transactions found','Try a different search or filter.', ICON.list) :
        rows.map(t=>{
          const canApprove = (role==='mayor'||role==='vice_mayor') && t.status==='pending';
          const canVerify = role==='auditor' && t.status==='approved';
          const canDelete = role==='mayor';
          const extra = [];
          if(canApprove) extra.push(`<button class="btn-sm gold" data-approve-tx="${t.id}" style="padding:6px 8px;">${ICON.check}</button>`, `<button class="btn-sm danger" data-reject-tx="${t.id}" style="padding:6px 8px;">${ICON.x}</button>`);
          if(canVerify) extra.push(`<button class="btn-sm ${t.verified?'ghost':'gold'}" data-verify-tx="${t.id}" style="padding:6px 8px;">${ICON.check}</button>`);
          if(canDelete) extra.push(`<button class="btn-sm danger" data-del-tx="${t.id}" style="padding:6px 8px;">${ICON.trash}</button>`);
          return `<div style="display:flex;align-items:center;gap:6px;">${txRowHTML(t)}${extra.length?`<div style="display:flex;gap:4px;flex-shrink:0;">${extra.join('')}</div>`:''}</div>`;
        }).join('')
      }
    </div>
  `;
}
function attachLedgerEvents(){
  const search = document.getElementById('ledgerSearch');
  if(search) search.oninput = ()=>{ state.search = search.value; render(); const el=document.getElementById('ledgerSearch'); if(el){ el.focus(); el.selectionStart=el.value.length; } };
  const typeF = document.getElementById('ledgerTypeFilter');
  if(typeF) typeF.onchange = ()=>{ state.typeFilter = typeF.value; render(); };
  const statusF = document.getElementById('ledgerStatusFilter');
  if(statusF) statusF.onchange = ()=>{ state.statusFilter = statusF.value; render(); };
  attachApprovalQueueEvents();
  document.querySelectorAll('[data-del-tx]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Delete this transaction record? This cannot be undone.')) return;
      await mutateShared('treasury_transactions', latest=>latest.filter(t=>t.id!==b.dataset.delTx));
      showToast('Record deleted');
      render();
    };
  });
}

/* ============== LIQUIDATION REPORT (transparency: use-of-funds report) ==============
   Shown both inside the officer app (editable narrative for Mayor/Treasurer) and on the
   public student dashboard (read-only). `editable` controls whether narrative textareas
   and save buttons render — attachLiquidationEvents(editable) mirrors that flag. */
function liquidationReportHTML(editable){
  const groups = getExpenseGroups();
  const allExpenses = approvedOf('expense').slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const view = state.liqView || 'grouped';
  const headingStyle = editable ? '' : ' style="color:#fff;"';
  const subStyle = editable ? '' : ' style="color:rgba(255,255,255,0.75);"';
  return `
    <h2 class="section-title"${headingStyle}>${ICON.checklist}Liquidation Report</h2>
    <p class="subtext"${subStyle}>Every approved expense, grouped by purpose, with receipts and a report of how the funds were used.</p>
    <div class="grid-stats">
      <div class="stat gold"><div class="stat-icon">${ICON.cash}</div><b>${formatPeso(totalCollections())}</b><span>Total Collections</span></div>
      <div class="stat danger"><div class="stat-icon">${ICON.cash}</div><b>${formatPeso(totalExpenses())}</b><span>Total Liquidated</span></div>
      <div class="stat"><div class="stat-icon">${ICON.chest}</div><b>${formatPeso(currentBalance())}</b><span>Fund Balance</span></div>
      <div class="stat pend"><div class="stat-icon">${ICON.list}</div><b>${groups.length}</b><span>Reported Purposes</span></div>
    </div>
    <div class="type-pick" id="liqViewToggle">
      <button type="button" data-view="grouped" class="${view==='grouped'?'sel':''}">${ICON.checklist}By Purpose</button>
      <button type="button" data-view="full" class="${view==='full'?'sel':''}">${ICON.list}Full List</button>
    </div>
    ${view==='grouped' ?
      (groups.length===0 ? `<div class="card">${emptyState('Nothing liquidated yet','Approved expenses will be grouped here by purpose or event.', ICON.checklist)}</div>` :
        groups.map(g=>liqGroupHTML(g, editable)).join(''))
      : `<div class="card">
          ${allExpenses.length===0 ? emptyState('No expenses yet','Approved expenses will show up here as a chronological list.', ICON.checklist) :
            allExpenses.map(txRowHTML).join('')}
        </div>`
    }
  `;
}
function liqGroupHTML(g, editable){
  const narrative = (state.liquidationNotes && state.liquidationNotes[g.key]) || '';
  const canEdit = editable && state.session && (state.session.role==='mayor' || state.session.role==='treasurer');
  return `
  <div class="card" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px;">
      <h3 style="margin:0;font-size:14.5px;color:var(--navy-950);">${escapeHtml(g.label)}</h3>
      <span class="mono" style="font-weight:800;color:var(--danger);font-size:14px;">${formatPeso(g.total)}</span>
    </div>
    <p class="subtext" style="margin:0 0 10px;">${g.entries.length} expense${g.entries.length===1?'':'s'} recorded</p>
    ${canEdit ? `
      <div class="field" style="margin-bottom:12px;">
        <label>Report on the Use of Funds</label>
        <textarea class="liq-narrative-input" data-purpose-key="${escapeHtml(g.key)}" placeholder="Explain what this was for and how the money was used…">${escapeHtml(narrative)}</textarea>
        <button type="button" class="btn-sm gold" data-save-narrative="${escapeHtml(g.key)}" style="margin-top:8px;">${ICON.check}Save Report</button>
      </div>
    ` : (narrative ? `<p class="liq-narrative-text">${escapeHtml(narrative)}</p>` : `<p class="subtext" style="font-style:italic;margin:0 0 10px;">No written report yet.</p>`)}
    <div class="liq-entries">
      ${g.entries.map(t=>`
        <div class="public-detail-row">
          <div class="pd-top">
            <span class="pd-check">${escapeHtml(t.category)}${t.verified?' ✓':''}</span>
            <span class="pd-date">${formatDateTime(t.date,t.time)}</span>
          </div>
          <span class="pd-sanction">${formatPeso(t.amount)}${t.payer?` — Paid to ${escapeHtml(t.payer)}`:''}${t.note?` · ${escapeHtml(t.note)}`:''}</span>
          <div style="margin-top:4px;">
            ${t.receipt ? `<a class="receipt-thumb-link" href="${t.receipt}" target="_blank" rel="noopener">${ICON.paperclip}View Receipt</a>` : `<span style="font-size:11px;color:var(--danger);font-weight:700;">No receipt attached</span>`}
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}
function attachLiquidationEvents(editable){
  document.querySelectorAll('#liqViewToggle button').forEach(b=>{
    b.onclick = ()=>{ state.liqView = b.dataset.view; render(); };
  });
  if(!editable) return;
  document.querySelectorAll('[data-save-narrative]').forEach(b=>{
    b.onclick = async ()=>{
      const key = b.dataset.saveNarrative;
      const ta = document.querySelector(`textarea[data-purpose-key="${window.CSS && CSS.escape ? CSS.escape(key) : key}"]`);
      const text = ta ? ta.value.trim() : '';
      await mutateShared('treasury_liquidation_notes', latest=>{
        const next = {...(latest||{})};
        if(text) next[key] = text; else delete next[key];
        return next;
      });
      showToast('Report saved');
      render();
    };
  });
}

function attachAccountsEvents(){

    if(isNaN(val) || val<0){ showToast('Enter a valid amount'); return; }
    state.duesAmount = val;
    lastSyncedRaw['treasury_dues_amount'] = JSON.stringify(val);
    await saveShared('treasury_dues_amount', val);
    showToast('Dues amount updated');
    render();
  };
  const addBtn = document.getElementById('addAccountBtn');
  if(addBtn) addBtn.onclick = ()=>{ state.modal={type:'account', data:{name:'',username:'',role:'treasurer'}}; render(); };
  document.querySelectorAll('[data-reset-pass]').forEach(b=>{
    b.onclick = ()=>{
      const a = state.accounts.find(x=>x.id===b.dataset.resetPass);
      state.modal={type:'resetpass', data:{id:a.id, name:a.name, username:a.username}};
      render();
    };
  });
  document.querySelectorAll('[data-del-account]').forEach(b=>{
    b.onclick = async ()=>{
      const target = state.accounts.find(a=>a.id===b.dataset.delAccount);
      if(!confirm(`Remove the account for "${target.name}"?`)) return;
      let blocked = false;
      await mutateShared('treasury_accounts', latest=>{
        const mayorCount = latest.filter(a=>a.role==='mayor').length;
        if(target.role==='mayor' && mayorCount<=1){ blocked=true; return latest; }
        return latest.filter(a=>a.id!==target.id);
      });
      if(blocked){ showToast("Can't remove the only Mayor account"); return; }
      showToast('Account removed');
      render();
    };
  });
}

      <button class="close-x" id="modalClose">${ICON.x}</button>
      <h2 class="section-title">Change Password</h2>
      <div class="field"><label>Current Password</label><input type="password" id="m_cur_password"/></div>
      <div class="field"><label>New Password</label><input type="password" id="m_new_password" placeholder="At least 4 characters"/></div>
      <div class="modal-actions">
        <button class="btn-sm ghost" id="modalCancel" style="flex:1;justify-content:center;">Cancel</button>
        <button class="btn-primary" id="modalSave">Update Password</button>
      </div>`;
  }
  back.innerHTML = `<div class="modal">${inner}</div>`;
  document.getElementById('root').appendChild(back);
  document.getElementById('modalClose').onclick = closeModal;
  const modalCancelBtn = document.getElementById('modalCancel');
  if(modalCancelBtn) modalCancelBtn.onclick = closeModal;
  back.onclick = (e)=>{ if(e.target===back) closeModal(); };
  document.getElementById('modalSave').onclick = saveModal;
}
function closeModal(){ state.modal=null; render(); }
async function saveModal(){
  const type = state.modal.type;
  const d = state.modal.data;
  if(type==='account'){
    const name = document.getElementById('m_acc_name').value.trim();
    const username = document.getElementById('m_acc_username').value.trim();
    const password = document.getElementById('m_acc_password').value;
    const role = document.getElementById('m_acc_role').value;
    if(!name || !username || !password){ showToast('Please fill in every field'); return; }
    if(password.length<4){ showToast('Password must be at least 4 characters'); return; }
    const passwordHash = await hashPassword(username, password);
    let taken = false;
    await mutateShared('treasury_accounts', latest=>{
      if(latest.some(a=>a.username.toLowerCase()===username.toLowerCase())){ taken=true; return latest; }
      latest.push({id:'acc_'+Date.now(), name, username, role, passwordHash});
      return latest;
    });
    if(taken){ showToast('That username is already taken'); return; }
    showToast('Account created');
    state.modal=null;
    render();
  } else if(type==='resetpass'){
    const password = document.getElementById('m_reset_password').value;
    if(!password || password.length<4){ showToast('Password must be at least 4 characters'); return; }
    const passwordHash = await hashPassword(d.username, password);
    let found = true;
    await mutateShared('treasury_accounts', latest=>{
      const acc = latest.find(a=>a.id===d.id);
      if(!acc){ found=false; return latest; }
      acc.passwordHash = passwordHash;
      return latest;
    });
    showToast(found ? 'Password updated' : 'That account was removed elsewhere');
    state.modal=null;
    render();
  } else if(type==='selfpass'){
    const cur = document.getElementById('m_cur_password').value;
    const next = document.getElementById('m_new_password').value;
    if(!next || next.length<4){ showToast('New password must be at least 4 characters'); return; }
    const curHash = await hashPassword(state.session.username, cur);
    const acc = state.accounts.find(a=>a.id===state.session.accountId);
    if(!acc || acc.passwordHash!==curHash){ showToast('Current password is incorrect'); return; }
    const nextHash = await hashPassword(state.session.username, next);
    await mutateShared('treasury_accounts', latest=>{
      const a = latest.find(x=>x.id===state.session.accountId);
      if(a) a.passwordHash = nextHash;
      return latest;
    });
    showToast('Password updated');
    state.modal=null;
    render();
  }
}

/* ============== Extra wiring for the treasurer dashboard CTA ============== */
document.addEventListener('click', (e)=>{
  const goto = e.target.closest && e.target.closest('[data-goto-log]');
  if(goto){ state.tab='log'; render(); }
});

/* ============== Boot ============== */
async function init(){
  const [accounts, transactions, roster, duesAmount, liquidationNotes, session] = await Promise.all([
    loadShared('treasury_accounts', []),
    loadShared('treasury_transactions', []),
    loadShared('roster', []),
    loadShared('treasury_dues_amount', 100),
    loadShared('treasury_liquidation_notes', {}),
    loadPersonal('session', null),
  ]);
  state.accounts = accounts;
  state.transactions = transactions;
  state.roster = roster || [];
  state.duesAmount = (typeof duesAmount==='number') ? duesAmount : 100;
  state.liquidationNotes = liquidationNotes || {};
  lastSyncedRaw = {
    treasury_accounts: JSON.stringify(state.accounts),
    treasury_transactions: JSON.stringify(state.transactions),
    roster: JSON.stringify(state.roster),
    treasury_dues_amount: JSON.stringify(state.duesAmount),
    treasury_liquidation_notes: JSON.stringify(state.liquidationNotes),
  };
  subscribeRealtime();
  startSyncPolling();

  if(!accounts || accounts.length===0){
    state.screen = 'setup';
  } else {
    const acc = session && session.accountId ? accounts.find(a=>a.id===session.accountId) : null;
    if(acc){
      state.session = {name:acc.name, role:acc.role, username:acc.username, accountId:acc.id};
      state.screen = 'app';
    } else {
      state.screen = 'gate';
    }
  }
  if(location.hash.replace('#','').toLowerCase()==='public'){
    state.screen = 'public';
  }
  render();
}
init();
</script>
