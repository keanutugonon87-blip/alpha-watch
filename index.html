<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALPHA WATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0a0a33;
    --navy-900:#0f0f4a;
    --navy-800:#151566;
    --navy-700:#1c1c86;
    --royal:#2b2bd6;
    --gold:#f0b429;
    --gold-light:#ffd868;
    --gold-dim:#c98f16;
    --cream:#f7f4ec;
    --paper:#fffdf8;
    --ink:#14141f;
    --ink-soft:#4a4a5e;
    --line:#e4dfd0;
    --pending:#d98c1f;
    --pending-bg:#fdf1de;
    --resolved:#237a4f;
    --resolved-bg:#e4f5ec;
    --danger:#c23b3b;
    --danger-bg:#fbe8e6;
    --radius:14px;
    --shadow:0 8px 28px rgba(10,10,51,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold-light);color:var(--navy-950);}
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Cinzel',serif;}

  /* ---------- App shell ---------- */
  #app{display:flex;min-height:100vh;flex-direction:column;}

  /* Topbar */
  .topbar{
    background:linear-gradient(120deg,var(--navy-950),var(--navy-800) 70%);
    color:var(--cream);
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;
    position:sticky;top:0;z-index:40;
    box-shadow:0 4px 20px rgba(10,10,51,0.25);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .logo-chip{
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .logo-chip img{display:block;width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 2px 6px rgba(10,10,51,0.35));}
  .brand .logo-chip{width:40px;height:40px;}
  .brand .name{display:flex;flex-direction:column;line-height:1.1;}
  .brand .name b{
    font-family:'Cinzel',serif;font-weight:700;letter-spacing:1.5px;
    font-size:16px;color:var(--gold-light);
  }
  .brand .name span{font-size:9.5px;letter-spacing:2px;color:#c9c9ea;text-transform:uppercase;}
  .who{display:flex;align-items:center;gap:8px;}
  .who .chip{
    background:rgba(240,180,41,0.14);
    border:1px solid rgba(240,180,41,0.45);
    color:var(--gold-light);
    font-size:11px;font-weight:700;letter-spacing:0.5px;
    padding:5px 10px;border-radius:20px;text-transform:uppercase;
  }
  .who button{
    background:none;border:1px solid rgba(255,255,255,0.25);color:#d8d8ee;
    font-size:11px;padding:5px 10px;border-radius:20px;cursor:pointer;font-family:'Manrope',sans-serif;
  }
  .who button:hover{border-color:var(--gold);color:var(--gold-light);}

  main{flex:1;padding:18px 16px 90px;max-width:920px;margin:0 auto;width:100%;}

  /* Bottom nav (mobile-first) */
  .navbar{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--navy-950);
    display:flex;justify-content:space-around;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(0,0,0,0.25);
  }
  .navbar button{
    background:none;border:none;color:#9797c4;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-family:'Manrope',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0.4px;
    padding:6px 8px;border-radius:10px;flex:1;text-transform:uppercase;
  }
  .navbar button svg{width:19px;height:19px;}
  .navbar button.active{color:var(--gold-light);position:relative;}
  .navbar button.active svg{filter:drop-shadow(0 0 6px rgba(240,180,41,0.5));}
  .navbar button.active::after{
    content:'';position:absolute;background:var(--gold);border-radius:3px;
    bottom:2px;left:50%;width:18px;height:3px;transform:translateX(-50%);
    animation:navGlow .3s ease;
  }
  @keyframes navGlow{from{width:0;opacity:0;}to{width:18px;opacity:1;}}
  @media(min-width:820px){
    .navbar button.active::after{bottom:auto;left:0;top:50%;width:3px;height:18px;transform:translateY(-50%);}
    @keyframes navGlow{from{height:0;opacity:0;}to{height:18px;opacity:1;}}
  }

  .navbar-logo{display:none;}
  @media(min-width:820px){
    #app{flex-direction:row;}
    .navbar{
      position:sticky;top:0;left:0;bottom:auto;flex-direction:column;
      width:180px;height:100vh;justify-content:flex-start;padding:18px 10px;gap:4px;
      box-shadow:4px 0 20px rgba(0,0,0,0.2);
    }
    .navbar-logo{
      display:flex;align-items:center;gap:9px;padding:6px 8px 18px;
    }
    .navbar-logo .logo-chip{width:36px;height:36px;}
    .navbar-logo b{font-family:'Cinzel',serif;font-size:12px;color:var(--gold-light);letter-spacing:1px;line-height:1.2;}
    .navbar button{flex-direction:row;justify-content:flex-start;font-size:12px;padding:11px 12px;gap:10px;}
    .topbar{display:none;}
    .top-desktop{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px 4px 22px;border-bottom:1px solid var(--line);margin-bottom:18px;
    }
    main{max-width:760px;padding-top:22px;}
  }
  .top-desktop{display:none;}

  /* ---------- Gate screen ---------- */
  .gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 30% 20%,var(--navy-800),var(--navy-950) 70%);
    padding:24px;
  }
  .gate-card{
    background:var(--paper);border-radius:20px;padding:34px 28px;max-width:380px;width:100%;
    box-shadow:0 30px 60px rgba(0,0,0,0.4);text-align:center;
    animation:cardRise .5s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes cardRise{from{opacity:0;transform:translateY(28px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .view-enter{animation:viewIn .4s cubic-bezier(.2,.9,.3,1);}
  @keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .gate-card .logo-chip{width:112px;height:112px;margin:0 auto 10px;animation:crestFloat 3.2s ease-in-out infinite;}
  .gate-card h1{font-family:'Cinzel',serif;font-size:24px;letter-spacing:2px;margin:6px 0 2px;color:var(--navy-950);}
  .gate-card .tag{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dim);font-weight:700;margin-bottom:22px;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);display:block;margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);
    font-family:'Manrope',sans-serif;font-size:14px;background:var(--cream);color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--royal);outline-offset:1px;border-color:var(--royal);}
  .role-pick{display:flex;gap:10px;margin-bottom:18px;}
  .role-pick button{
    flex:1;padding:14px 8px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);
    cursor:pointer;font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .role-pick button svg{width:22px;height:22px;}
  .role-pick button.sel{border-color:var(--royal);background:#eceafc;color:var(--navy-950);}
  .btn-primary{
    width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;
    background:linear-gradient(120deg,var(--navy-900),var(--royal));color:#fff;
    font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;letter-spacing:0.4px;
    box-shadow:0 8px 20px rgba(43,43,214,0.35);
    display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .btn-primary svg{width:15px;height:15px;flex-shrink:0;}
  .btn-primary:disabled{opacity:0.45;cursor:not-allowed;box-shadow:none;}
  .gate-note{font-size:11px;color:var(--ink-soft);margin-top:14px;line-height:1.5;}

  /* ---------- Shared components ---------- */
  h2.section-title{
    font-family:'Cinzel',serif;font-size:19px;color:var(--navy-950);letter-spacing:0.5px;
    display:flex;align-items:center;gap:9px;margin:0 0 4px;position:relative;padding-bottom:9px;
  }
  h2.section-title::after{
    content:'';position:absolute;left:0;bottom:0;width:38px;height:3px;border-radius:3px;
    background:linear-gradient(90deg,var(--gold),var(--gold-light));
  }
  h2.section-title svg{width:20px;height:20px;color:var(--gold-dim);}
  .subtext{color:var(--ink-soft);font-size:12.5px;margin:10px 0 18px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  @media(min-width:560px){.grid-stats{grid-template-columns:repeat(4,1fr);}}
  .stat{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;
    position:relative;overflow:hidden;
  }
  .stat-icon{
    position:absolute;top:10px;right:10px;width:26px;height:26px;color:var(--line);opacity:.9;
  }
  .stat-icon svg{width:100%;height:100%;}
  .stat.gold .stat-icon{color:var(--gold);}
  .stat.pend .stat-icon{color:var(--pending);}
  .stat.res .stat-icon{color:var(--resolved);}
  .stat b{font-family:'JetBrains Mono',monospace;font-size:26px;display:block;color:var(--navy-950);}
  .stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;font-weight:700;color:var(--ink-soft);}
  .stat.gold{border-color:var(--gold);}
  .stat.gold b{color:var(--gold-dim);}
  .stat.pend b{color:var(--pending);}
  .stat.res b{color:var(--resolved);}

  .howl-meter{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
  .howl-meter .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .howl-meter .row b{font-family:'Cinzel',serif;font-size:14px;color:var(--navy-950);}
  .howl-meter .row .level{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;padding:3px 9px;border-radius:20px;}
  .bar-track{height:10px;background:var(--line);border-radius:20px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold),var(--pending),var(--danger));transition:width .5s ease;}

  .list-item{
    display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .avatar{
    width:38px;height:38px;border-radius:10px;background:var(--navy-900);color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:14px;
    flex-shrink:0;
  }
  .li-main{flex:1;min-width:0;}
  .li-main b{font-size:13.5px;display:block;color:var(--ink);}
  .li-main span{font-size:11.5px;color:var(--ink-soft);}
  .status-chip{
    font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;padding:4px 9px;border-radius:20px;flex-shrink:0;
    display:inline-flex;align-items:center;gap:4px;
  }
  .status-chip svg{width:11px;height:11px;}
  .status-chip.pending{background:var(--pending-bg);color:var(--pending);}
  .status-chip.resolved{background:var(--resolved-bg);color:var(--resolved);}

  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty-icon-wrap{
    width:74px;height:74px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle,rgba(240,180,41,0.14),rgba(240,180,41,0) 70%);
  }
  .empty svg{width:38px;height:38px;color:var(--gold-dim);opacity:.55;}
  .empty b{display:block;font-size:14px;color:var(--ink);margin-bottom:3px;}
  .empty span{font-size:12px;}

  .fab-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;}
  .btn-sm{
    padding:9px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:12.5px;
    font-family:'Manrope',sans-serif;background:var(--navy-950);color:#fff;display:flex;align-items:center;gap:6px;
  }
  .btn-sm svg{width:14px;height:14px;}
  .btn-sm.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);}
  .btn-sm.danger{background:var(--danger-bg);color:var(--danger);}
  .btn-sm.gold{background:var(--gold);color:var(--navy-950);position:relative;overflow:hidden;}
  .btn-sm.gold::after{
    content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(115deg,transparent,rgba(255,255,255,0.55),transparent);
    transform:skewX(-20deg);transition:left .5s ease;
  }
  .btn-sm.gold:hover::after{left:130%;}

  .search{
    display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);
    border-radius:12px;padding:9px 12px;margin-bottom:14px;
  }
  .search svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}
  .search input{border:none;background:none;outline:none;font-family:'Manrope',sans-serif;font-size:13.5px;width:100%;color:var(--ink);}
  .search select{border:none;background:none;font-family:'Manrope',sans-serif;font-size:12px;color:var(--ink-soft);font-weight:700;}

  .std-item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--paper);}
  .std-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .std-item .num{
    width:26px;height:26px;border-radius:8px;background:var(--navy-950);color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;flex-shrink:0;
  }
  .std-item h3{font-size:14px;margin:0 0 3px;color:var(--ink);}
  .std-item p{font-size:12px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .std-item .sanction{
    margin-top:9px;font-size:11.5px;background:var(--pending-bg);color:var(--gold-dim);
    padding:6px 10px;border-radius:8px;display:inline-block;font-weight:700;
  }

  form .field textarea{resize:vertical;min-height:60px;}
  .modal-back{
    position:fixed;inset:0;background:rgba(10,10,51,0.55);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;
  }
  @media(min-width:640px){.modal-back{align-items:center;}}
  .modal{
    background:var(--paper);width:100%;max-width:460px;border-radius:20px 20px 0 0;
    padding:22px 20px 26px;max-height:88vh;overflow-y:auto;
  }
  @media(min-width:640px){.modal{border-radius:20px;}}
  .modal h2{margin-top:0;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn-primary{flex:1;}
  .close-x{float:right;background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:18px;}

  .toast{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    background:var(--navy-950);color:var(--gold-light);padding:10px 18px;border-radius:30px;
    font-size:12.5px;font-weight:700;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,0.3);
    animation:toastIn .3s cubic-bezier(.3,1.4,.5,1);
    display:flex;align-items:center;gap:8px;
  }
  .toast-icon{width:15px;height:15px;flex-shrink:0;color:var(--gold);}
  .toast-icon svg{width:100%;height:100%;}
  @media(min-width:820px){.toast{bottom:22px;left:calc(50% + 90px);}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px) scale(.9);}to{opacity:1;transform:translate(-50%,0) scale(1);}}

  .loading{
    display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
    color:var(--gold-light);font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;gap:14px;
    background:radial-gradient(circle at 50% 30%,var(--navy-800),var(--navy-950) 75%);
  }
  .loading-crest{width:52px;height:52px;color:var(--gold);animation:crestFloat 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(240,180,41,0.45));}
  .loading-crest svg{width:100%;height:100%;}
  .loading-ring{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid rgba(240,180,41,0.2);border-top-color:var(--gold);
    animation:spin .9s linear infinite;
  }
  @keyframes crestFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Polish: transitions & hover states ---------- */
  .card{transition:box-shadow .2s ease, transform .2s ease;}
  .std-item{transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;}
  .std-item:hover{box-shadow:0 10px 24px rgba(10,10,51,0.1);border-color:var(--gold);transform:translateY(-1px);}
  .stat{transition:box-shadow .2s ease, transform .2s ease;}
  .stat:hover{box-shadow:0 10px 22px rgba(10,10,51,0.1);transform:translateY(-2px);}
  .list-item{transition:background .15s ease;border-radius:10px;animation:itemIn .35s ease backwards;}
  @keyframes itemIn{from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);}}
  .list-item:nth-child(1){animation-delay:.02s;}
  .list-item:nth-child(2){animation-delay:.05s;}
  .list-item:nth-child(3){animation-delay:.08s;}
  .list-item:nth-child(4){animation-delay:.11s;}
  .list-item:nth-child(5){animation-delay:.14s;}
  .list-item:nth-child(6){animation-delay:.17s;}
  .list-item:nth-child(n+7){animation-delay:.19s;}
  .list-item:hover{background:rgba(43,43,214,0.045);}
  .btn-primary{transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 10px 26px rgba(43,43,214,0.42);}
  .btn-primary:active:not(:disabled){transform:translateY(1px);}
  .btn-sm{transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;}
  .btn-sm:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-sm:active{transform:translateY(0);}
  .btn-sm.gold:hover{box-shadow:0 8px 18px rgba(240,180,41,0.4);}
  .navbar button{transition:color .15s ease, background .15s ease;}
  .navbar button:hover{color:var(--gold-light);background:rgba(240,180,41,0.08);}
  .search{transition:border-color .15s ease, box-shadow .15s ease;}
  .search:focus-within{border-color:var(--royal);box-shadow:0 0 0 3px rgba(43,43,214,0.12);}
  .avatar{box-shadow:0 2px 6px rgba(10,10,51,0.25);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .role-pick button{transition:border-color .15s ease, background .15s ease, transform .15s ease;}
  .role-pick button:hover{border-color:var(--royal);transform:translateY(-1px);}
  .close-x{transition:color .15s ease, transform .15s ease;}
  .close-x:hover{color:var(--danger);transform:rotate(90deg);}
  .modal{animation:modalUp .25s cubic-bezier(.2,.9,.3,1);}
  @keyframes modalUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
  .modal-back{animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .status-chip{transition:transform .15s ease, filter .15s ease;}
  .status-chip[data-toggle-status]:hover{filter:brightness(0.95);transform:scale(1.04);}

  /* ---------- Photo picker (student profile photo) ---------- */
  .photo-picker{display:flex;align-items:center;gap:14px;margin-bottom:2px;}
  .photo-preview{
    width:64px;height:64px;border-radius:14px;background:var(--navy-900);color:var(--gold-light);
    display:flex;align-items:center;justify-content:center;font-family:'Cinzel',serif;font-weight:700;font-size:20px;
    flex-shrink:0;overflow:hidden;box-shadow:0 4px 14px rgba(10,10,51,0.3);border:2px solid var(--gold);
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-actions{display:flex;flex-direction:column;gap:6px;flex:1;}
  .photo-actions .btn-sm{justify-content:center;}
  .photo-hint{font-size:10.5px;color:var(--ink-soft);margin:0;}

  /* ---------- Searchable combo (student picker) ---------- */
  .combo{position:relative;}
  .combo-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:60;
    background:var(--paper);border:1.5px solid var(--line);border-radius:12px;
    box-shadow:0 14px 30px rgba(10,10,51,0.22);max-height:230px;overflow-y:auto;padding:6px;
  }
  .combo-item{
    display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;cursor:pointer;
  }
  .combo-item:hover, .combo-item.hl{background:rgba(43,43,214,0.08);}
  .combo-item b{font-size:13px;display:block;color:var(--ink);}
  .combo-item span{font-size:11px;color:var(--ink-soft);}
  .combo-empty{padding:14px 8px;text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .combo-item .avatar{width:26px;height:26px;font-size:11px;flex-shrink:0;}

  /* ---------- Dashboard flourishes ---------- */
  .howl-flame{animation:flamePulse 1.4s ease-in-out infinite;}
  @keyframes flamePulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.18);opacity:.7;}}
  .medal-badge{
    position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;background:var(--gold);color:var(--navy-950);
    border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper);
    animation:chipPop .45s cubic-bezier(.3,1.5,.6,1);
  }
  .medal-badge svg{width:11px;height:11px;}
  @keyframes chipPop{from{transform:scale(0) rotate(-30deg);}to{transform:scale(1) rotate(0);}}
  .top-violator{position:relative;overflow:hidden;}
  .top-violator::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));
  }

  /* ---------- Inspection checklist ---------- */
  .inspect-list{display:flex;flex-direction:column;gap:10px;max-height:44vh;overflow-y:auto;padding-right:2px;margin-bottom:16px;}
  .inspect-item{
    border:1.5px solid var(--line);border-radius:12px;padding:12px;transition:border-color .2s ease, background .2s ease;
  }
  .inspect-item.fail{border-color:var(--danger);background:var(--danger-bg);}
  .inspect-item.pass{border-color:var(--line);}
  .inspect-item-top{display:flex;align-items:center;gap:10px;}
  .inspect-item-top b{font-size:13px;color:var(--ink);}
  .inspect-num{
    width:24px;height:24px;border-radius:7px;background:var(--navy-950);color:var(--gold-light);
    font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .toggle-pair{display:flex;gap:6px;flex-shrink:0;}
  .toggle-btn{
    display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--ink-soft);font-size:11px;font-weight:800;cursor:pointer;
    transition:all .15s ease;
  }
  .toggle-btn svg{width:12px;height:12px;}
  .toggle-btn.pass.on{background:var(--resolved-bg);border-color:var(--resolved);color:var(--resolved);}
  .toggle-btn.fail.on{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
  .insp-tag{color:var(--royal);font-weight:700;}
</style>
</head>

const SUPABASE_URL = 'https://gxwgkbplscsduscoeoph.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_m3l1Dxhwj6bIse-3UwBB4w_fqZXLuD0';

// "Shared" data (roster, standard, ledger, accounts) lives in the
// `shared_data` table (key text primary key, value jsonb) so every
// device/browser sees the same class data.
async function loadShared(key, fallback){
  try{
    const { data, error } = await sb.from('shared_data').select('value').eq('key', key).maybeSingle();
    if(error) throw error;
    return data ? data.value : fallback;
  }catch(e){ console.error('load failed', key, e); return fallback; }
}
async function saveShared(key, value){
  try{
    const { error } = await sb.from('shared_data').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error) throw error;
  }catch(e){ console.error('save failed', key, e); }
}

// "Personal" data (just the local sign-in session) stays on-device
// via localStorage — it should NOT sync across browsers.
async function loadPersonal(key, fallback){
  try{
    const raw = localStorage.getItem('alpha-watch::'+key);
    return raw!=null ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function savePersonal(key, value){
  try{ localStorage.setItem('alpha-watch::'+key, JSON.stringify(value)); }catch(e){ console.error('save failed', key, e); }
}

/* ============== Password hashing (SHA-256, salted with username) ============== */
async function hashPassword(username, password){
  const enc = new TextEncoder();
  const data = enc.encode('alpha-watch::'+String(username).trim().toLowerCase()+'::'+password);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function runCountUps(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseInt(el.dataset.count, 10) || 0;
    if(target===0){ el.textContent='0'; return; }
    const duration = 550;
    const start = performance.now();
    function tick(now){
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(eased*target);
      if(p<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

function logHTML(){
  if(state.roster.length===0){
    return `<h2 class="section-title">${ICON.plus}Log a Violation</h2>
      ${emptyState('No students yet', 'Ask the Mayor to add students to the Pack Roster first.', ICON.users)}`;
  }
  return `
    <h2 class="section-title">${ICON.plus}Log a Violation</h2>
    <p class="subtext">Fill this out the moment a checkpoint is missed.</p>
    <form class="card" id="logForm">
      <div class="field combo" id="lf_student_combo">
        <label>Student</label>
        <input type="text" id="lf_student_search" placeholder="Type a name to search…" autocomplete="off" required/>
        <input type="hidden" id="lf_student_id" value=""/>
        <div class="combo-list" id="lf_student_list" style="display:none;"></div>
      </div>
      <div class="field">
        <label>Checkpoint Violated</label>
        <select id="lf_category" required>
          <option value="">Select checkpoint…</option>
          ${state.standard.map(c=>`<option value="${c.id}">${escapeHtml(c.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="lf_date" value="${todayISO()}" required/>
      </div>
      <div class="field">
        <label>Sanction</label>
        <input type="text" id="lf_sanction" placeholder="e.g. 1st Offense: Verbal Warning"/>
      </div>
      <div class="field">
        <label>Reported By</label>
        <input type="text" id="lf_reporter" value="${escapeHtml(state.session.name)}" required/>
      </div>
      <button type="submit" class="btn-primary">Submit Violation</button>
    </form>
  `;
}
function renderStudentCombo(filterText){
  const list = document.getElementById('lf_student_list');
  if(!list) return;
  const q = (filterText||'').trim().toLowerCase();
  const matches = state.roster.filter(s=> !q || s.name.toLowerCase().includes(q) || (s.section||'').toLowerCase().includes(q));
  if(matches.length===0){
    list.innerHTML = `<div class="combo-empty">No students found</div>`;
  } else {
    list.innerHTML = matches.slice(0,50).map(s=>`
      <div class="combo-item" data-id="${s.id}">
        ${avatarHTML(s, 'width:26px;height:26px;font-size:11px;')}
        <div><b>${escapeHtml(s.name)}</b>${s.section?`<span>${escapeHtml(s.section)}</span>`:''}</div>
      </div>`).join('');
  }
  list.style.display = 'block';
  list.querySelectorAll('.combo-item').forEach(item=>{
    item.onclick = ()=>{
      const s = state.roster.find(x=>x.id===item.dataset.id);
      if(!s) return;
      document.getElementById('lf_student_search').value = s.name;
      document.getElementById('lf_student_id').value = s.id;
      list.style.display = 'none';
    };
  });
}
function attachLogEvents(){
  const form = document.getElementById('logForm');
  if(!form) return;
  const catSel = document.getElementById('lf_category');
  catSel.onchange = ()=>{
    const c = state.standard.find(x=>x.id===catSel.value);
    if(c) document.getElementById('lf_sanction').value = c.sanction;
  };
  const studentSearch = document.getElementById('lf_student_search');
  const studentIdInput = document.getElementById('lf_student_id');
  if(studentSearch){
    studentSearch.onfocus = ()=> renderStudentCombo(studentSearch.value);
    studentSearch.oninput = ()=>{ studentIdInput.value=''; renderStudentCombo(studentSearch.value); };
  }
  form.onsubmit = async (e)=>{
    e.preventDefault();
    let studentId = studentIdInput.value;
    if(!studentId && studentSearch){
      const typed = studentSearch.value.trim().toLowerCase();
      const exact = state.roster.find(s=>s.name.trim().toLowerCase()===typed);
      if(exact) studentId = exact.id;
    }
    const rec = {
      id: 'v_'+Date.now(),
      studentId,
      categoryId: document.getElementById('lf_category').value,
      date: document.getElementById('lf_date').value,
      sanction: document.getElementById('lf_sanction').value || 'Verbal Warning',
      reportedBy: document.getElementById('lf_reporter').value.trim() || state.session.name,
      status: 'pending',
    };
    if(!rec.studentId){ showToast('Please select a student from the list'); return; }
    if(!rec.categoryId){ showToast('Please select a checkpoint'); return; }
    state.ledger.push(rec);
    await saveShared('ledger', state.ledger);
    showToast('Violation logged');
    state.tab='ledger';
    render();
  };
}

/* ============== LEDGER ============== */
function ledgerHTML(){
  const isMayor = state.session.role==='mayor';
  const q = state.search.toLowerCase();
  let rows = state.ledger.map(v=>{
    const st = state.roster.find(s=>s.id===v.studentId);
    const cat = state.standard.find(c=>c.id===v.categoryId);
    return {...v, studentName: st?st.name:'Unknown', studentPhoto: st?st.photo:null, catTitle: cat?cat.title:'Unknown'};
  }).filter(v=>{
    const matchQ = !q || v.studentName.toLowerCase().includes(q) || v.catTitle.toLowerCase().includes(q);
    const matchS = state.statusFilter==='all' || v.status===state.statusFilter;
    return matchQ && matchS;
  }).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  return `
    <h2 class="section-title">${ICON.list}The Ledger</h2>
    <p class="subtext">Full record of every violation logged.</p>
    <div class="fab-row" style="justify-content:flex-end;">
      <button class="btn-sm gold" id="exportCsvBtn">${ICON.download}Export CSV</button>
    </div>
    <div class="search">
      ${ICON.search}<input id="ledgerSearch" placeholder="Search student or checkpoint…" value="${escapeHtml(state.search)}"/>
      <select id="ledgerFilter">
        <option value="all" ${state.statusFilter==='all'?'selected':''}>All</option>
        <option value="pending" ${state.statusFilter==='pending'?'selected':''}>Pending</option>
        <option value="resolved" ${state.statusFilter==='resolved'?'selected':''}>Resolved</option>
      </select>
    </div>
    <div class="card">
      ${rows.length===0? emptyState('No records match','Try a different search or filter.', ICON.search) :
        rows.map(v=>`
          <div class="list-item">
            ${avatarHTML({name:v.studentName, photo:v.studentPhoto})}
            <div class="li-main">
              <b>${escapeHtml(v.studentName)}</b>
              <span>${escapeHtml(v.catTitle)} · ${formatDate(v.date)} · ${escapeHtml(v.sanction)}</span>
              <span style="display:block;color:var(--ink-soft);">Reported by ${escapeHtml(v.reportedBy)}${v.source==='inspection'?' · <span class="insp-tag">Inspection</span>':''}</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
              <span class="status-chip ${v.status}" ${isMayor?`data-toggle-status="${v.id}" style="cursor:pointer;"`:''}>${v.status==='resolved'?ICON.check:ICON.clock}${v.status}</span>
              ${isMayor?`<button class="btn-sm danger" data-del-violation="${v.id}" style="padding:4px 8px;">${ICON.trash}</button>`:''}
            </div>
          </div>
        `).join('')
      }
    </div>
  `;
}
function attachLedgerEvents(){
  const exportBtn = document.getElementById('exportCsvBtn');
  if(exportBtn) exportBtn.onclick = exportLedgerCSV;
  const search = document.getElementById('ledgerSearch');
  if(search) search.oninput = ()=>{ state.search = search.value; render(); const el=document.getElementById('ledgerSearch'); el.focus(); el.selectionStart=el.value.length; };
  const filt = document.getElementById('ledgerFilter');
  if(filt) filt.onchange = ()=>{ state.statusFilter = filt.value; render(); };
  document.querySelectorAll('[data-toggle-status]').forEach(el=>{
    el.onclick = async ()=>{
      const rec = state.ledger.find(v=>v.id===el.dataset.toggleStatus);
      rec.status = rec.status==='pending' ? 'resolved' : 'pending';
      await saveShared('ledger', state.ledger);
      showToast(`Marked as ${rec.status}`);
      render();
    };
  });
  document.querySelectorAll('[data-del-violation]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Delete this violation record?')) return;
      state.ledger = state.ledger.filter(v=>v.id!==b.dataset.delViolation);
      await saveShared('ledger', state.ledger);
      showToast('Record deleted');
      render();
    };
  });
}

              </div>

            ${c.status==='fail'?`<div class="field" style="margin:10px 0 0;"><label>Note (optional)</label><input type="text" data-note-check="${i}" value="${escapeHtml(c.note||'')}" placeholder="e.g. missing ID lace"/></div>`:''}
          </div>
        `).join('')}
        </div>`
      }
      <div class="modal-actions">
        <button class="btn-sm ghost" id="modalCancel" style="flex:1;justify-content:center;">Cancel</button>
        <button class="btn-primary" id="modalSave">${ICON.send}${failCount>0?`Send Report (${failCount})`:'Send Report'}</button>
      </div>`;
  } else if(state.modal.type==='resetpass'){
    const d = state.modal.data;
    inner = `
      <button class="close-x" id="modalClose">✕</button>
      <h2 class="section-title">Reset Password</h2>
      <p class="subtext">Set a new password for ${escapeHtml(d.name)} (@${escapeHtml(d.username)}).</p>
      <div class="field"><label>New Password</label><input type="password" id="m_reset_password" placeholder="At least 4 characters"/></div>
      <div class="modal-actions">
        <button class="btn-sm ghost" id="modalCancel" style="flex:1;justify-content:center;">Cancel</button>
        <button class="btn-primary" id="modalSave">Save New Password</button>
      </div>`;
  } else if(state.modal.type==='selfpass'){
    inner = `
      <button class="close-x" id="modalClose">✕</button>
      <h2 class="section-title">Change Password</h2>
      <div class="field"><label>Current Password</label><input type="password" id="m_cur_password"/></div>
      <div class="field"><label>New Password</label><input type="password" id="m_new_password" placeholder="At least 4 characters"/></div>
      <div class="modal-actions">
        <button class="btn-sm ghost" id="modalCancel" style="flex:1;justify-content:center;">Cancel</button>
        <button class="btn-primary" id="modalSave">Update Password</button>
      </div>`;
  }
  back.innerHTML = `<div class="modal">${inner}</div>`;
  document.getElementById('root').appendChild(back);
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalCancel').onclick = closeModal;
  back.onclick = (e)=>{ if(e.target===back) closeModal(); };
  document.getElementById('modalSave').onclick = saveModal;

  if(state.modal.type==='student'){
    const photoInput = document.getElementById('m_photo_input');
    const photoBtn = document.getElementById('m_photo_btn');
    const photoRemove = document.getElementById('m_photo_remove');
    const nameInput = document.getElementById('m_name');
    if(photoBtn) photoBtn.onclick = ()=> photoInput.click();
    if(photoInput) photoInput.onchange = async ()=>{
      const file = photoInput.files[0];
      if(!file) return;
      try{
        const dataUrl = await resizeImageFile(file, 240);
        state.modal.data.photo = dataUrl;
        render();
      }catch(err){ showToast('Could not load that image'); }
    };
    if(photoRemove) photoRemove.onclick = ()=>{
      delete state.modal.data.photo;
      render();
    };
    if(nameInput) nameInput.oninput = ()=>{
      if(!state.modal.data.photo){
        const preview = document.getElementById('m_photo_preview');
        if(preview) preview.textContent = initials(nameInput.value);
      }
    };
  } else if(state.modal.type==='inspect'){
    document.querySelectorAll('[data-toggle-check]').forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.toggleCheck, 10);
        state.modal.data.checklist[i].status = btn.dataset.val;
        render();
      };
    });
    document.querySelectorAll('[data-note-check]').forEach(inp=>{
      inp.oninput = ()=>{
        const i = parseInt(inp.dataset.noteCheck, 10);
        state.modal.data.checklist[i].note = inp.value;
      };
    });
  }
}
function closeModal(){ state.modal=null; render(); }
async function saveModal(){
  const type = state.modal.type;
  const d = state.modal.data;
  if(type==='inspect'){
    await sendInspectionReport(d);
    return;
  }
  if(type==='student'){
    const name = document.getElementById('m_name').value.trim();
    if(!name){ showToast('Name is required'); return; }
    const photo = d.photo || null;
    if(d.id){
      const s = state.roster.find(x=>x.id===d.id);
      s.name=name; s.photo=photo;
    } else {
      state.roster.push({id:'st_'+Date.now(), name, photo});
    }
    await saveShared('roster', state.roster);
    showToast('Student saved');
  } else if(type==='standard'){
    const title = document.getElementById('m_title').value.trim();
    const local = document.getElementById('m_local').value.trim();
    const rule = document.getElementById('m_rule').value.trim();
    const sanction = document.getElementById('m_sanction').value.trim() || 'Verbal Warning';
    if(!title){ showToast('Title is required'); return; }
    if(d.id){
      const c = state.standard.find(x=>x.id===d.id);
      c.title=title; c.local=local; c.rule=rule; c.sanction=sanction;
    } else {
      state.standard.push({id:'std_'+Date.now(), title, local, rule, sanction});
    }
    await saveShared('standard', state.standard);
    showToast('Checkpoint saved');
  } else if(type==='account'){
    const name = document.getElementById('m_acc_name').value.trim();
    const username = document.getElementById('m_acc_username').value.trim();
    const password = document.getElementById('m_acc_password').value;
    const role = document.getElementById('m_acc_role').value;
    if(!name || !username || !password){ showToast('Please fill in every field'); return; }
    if(password.length<4){ showToast('Password must be at least 4 characters'); return; }
    if(state.accounts.some(a=>a.username.toLowerCase()===username.toLowerCase())){ showToast('That username is already taken'); return; }
    const passwordHash = await hashPassword(username, password);
    state.accounts.push({id:'acc_'+Date.now(), name, username, role, passwordHash});
    await saveShared('accounts', state.accounts);
    showToast('Account created');
  } else if(type==='resetpass'){
    const password = document.getElementById('m_reset_password').value;
    if(!password || password.length<4){ showToast('Password must be at least 4 characters'); return; }
    const acc = state.accounts.find(a=>a.id===d.id);
    acc.passwordHash = await hashPassword(acc.username, password);
    await saveShared('accounts', state.accounts);
    showToast('Password reset');
  } else if(type==='selfpass'){
    const cur = document.getElementById('m_cur_password').value;
    const next = document.getElementById('m_new_password').value;
    const acc = state.accounts.find(a=>a.id===state.session.accountId);
    if(!acc){ showToast('Account not found'); return; }
    const curHash = await hashPassword(acc.username, cur);
    if(curHash!==acc.passwordHash){ showToast('Current password is incorrect'); return; }
    if(!next || next.length<4){ showToast('New password must be at least 4 characters'); return; }
    acc.passwordHash = await hashPassword(acc.username, next);
    await saveShared('accounts', state.accounts);
    showToast('Password updated');
  }
  state.modal=null;
  render();
}
async function sendInspectionReport(d){
  const fails = d.checklist.filter(c=>c.status==='fail');
  if(fails.length===0){
    showToast('No violations found — nothing to report');
    state.modal=null;
    render();
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  fails.forEach((c,i)=>{
    state.ledger.push({
      id: 'v_'+Date.now()+'_'+i,
      studentId: d.studentId,
      categoryId: c.checkpointId,
      date: today,
      sanction: c.note ? `${c.sanction} — ${c.note}` : c.sanction,
      reportedBy: state.session.name,
      status: 'pending',
      source: 'inspection',
    });
  });
  await saveShared('ledger', state.ledger);
  showToast(`Report sent to the Secretary — ${fails.length} violation${fails.length>1?'s':''} logged`);
  state.modal=null;
  render();
}

/* ============== Utils ============== */
function initials(name){ return (name||'').split(' ').filter(Boolean).slice(0,2).map(n=>n[0].toUpperCase()).join(''); }
function avatarHTML(person, extraStyle){
  const style = extraStyle ? ` style="${extraStyle}"` : '';
  if(person && person.photo){
    return `<div class="avatar"${style}><img src="${person.photo}" alt=""/></div>`;
  }
  return `<div class="avatar"${style}>${escapeHtml(initials(person?person.name:'?'))}</div>`;
}
function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject)=>{
    if(!file.type || !file.type.startsWith('image/')){ reject(new Error('Not an image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not load image'));
      img.onload = ()=>{
        let {width, height} = img;
        const scale = Math.min(1, maxSize/Math.max(width, height));
        width = Math.max(1, Math.round(width*scale));
        height = Math.max(1, Math.round(height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function formatDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function emptyState(title,sub,icon){ return `<div class="empty"><div class="empty-icon-wrap">${icon||ICON.clipboard}</div><b>${escapeHtml(title)}</b><span>${escapeHtml(sub)}</span></div>`; }

/* ---- CSV export ---- */
function csvEscape(v){ return `"${String(v==null?'':v).replace(/"/g,'""')}"`; }
function toCSV(rows, headers){
  const lines = [headers.map(csvEscape).join(',')];
  rows.forEach(r=> lines.push(headers.map(h=>csvEscape(r[h])).join(',')));
  return lines.join('\r\n');
}
function downloadCSV(filename, csvString){
  const blob = new Blob(['\ufeff'+csvString], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportLedgerCSV(){
  if(state.ledger.length===0){ showToast('No violations to export yet'); return; }
  const rows = state.ledger.map(v=>{
    const st = state.roster.find(s=>s.id===v.studentId);
    const cat = state.standard.find(c=>c.id===v.categoryId);
    return {
      Student: st ? st.name : 'Unknown',
      Section: st ? (st.section||'') : '',
      Checkpoint: cat ? cat.title : 'Unknown',
      Date: v.date,
      Sanction: v.sanction,
      'Reported By': v.reportedBy,
      Status: v.status,
    };
  }).sort((a,b)=> (a.Date||'').localeCompare(b.Date||''));
  const csv = toCSV(rows, ['Student','Section','Checkpoint','Date','Sanction','Reported By','Status']);
  downloadCSV(`alpha-watch-violations-${todayISO()}.csv`, csv);
  showToast('CSV downloaded');
}
/* Close any open searchable-combo dropdown when clicking elsewhere */
document.addEventListener('click', (e)=>{
  document.querySelectorAll('.combo-list').forEach(list=>{
    const combo = list.closest('.combo');
    if(combo && !combo.contains(e.target)) list.style.display='none';
  });
});

let toastTimer=null;
function showToast(msg){
  state.toast=msg; render();
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2200);
}

/* ============== Init ============== */
async function init(){
  const [roster, standard, ledger, accounts, session] = await Promise.all([
    loadShared('roster', []),
    loadShared('standard', DEFAULT_STANDARD),
    loadShared('ledger', []),
    loadShared('accounts', []),
    loadPersonal('session', null),
  ]);
  state.roster = roster;
  state.standard = standard && standard.length ? standard : DEFAULT_STANDARD;
  state.ledger = ledger;
  state.accounts = accounts;
  if(!standard || !standard.length) await saveShared('standard', DEFAULT_STANDARD);

  if(!accounts || accounts.length===0){
    state.screen = 'setup';
  } else {
    const acc = session && session.accountId ? accounts.find(a=>a.id===session.accountId) : null;
    if(acc){
      // re-hydrate from the account record in case the Mayor changed name/role since last visit
      state.session = {name:acc.name, role:acc.role, username:acc.username, accountId:acc.id};
      state.screen = 'app';
    } else {
      state.screen = 'gate';
    }
  }
  render();
}
init();
